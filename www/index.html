<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no">

    <meta name="theme-color" content="#1565c0">

    <title>حساباتي</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- الرأس -->

    <header class="header">

        <div>
            <h1>حساباتي</h1>
            <p>دفتر الحسابات</p>
        </div>

        <div class="db-status" id="dbStatus">
            ●
        </div>

    </header>


    <!-- الصفحة الرئيسية -->

    <main id="homePage">

        <section class="summary">

            <div class="summary-card">
                <span>عدد العملاء</span>
                <strong id="customersCount">0</strong>
            </div>

            <div class="summary-card">
                <span>إجمالي المستحق</span>
                <strong id="totalDebt">0</strong>
            </div>

        </section>


        <div class="toolbar">

            <input
                id="searchInput"
                type="search"
                placeholder="ابحث عن عميل..."
                autocomplete="off">

            <button
                class="primary"
                onclick="showAddCustomer()">
                + إضافة عميل
            </button>

        </div>


        <section>

            <h2>العملاء</h2>

            <div id="customersList"></div>

        </section>

    </main>


    <!-- صفحة العميل -->

    <main id="customerPage" class="hidden">

        <button
            class="back"
            onclick="showHome()">
            ← العودة للعملاء
        </button>

        <section class="customer-header">

            <div class="avatar" id="customerAvatar">
                ع
            </div>

            <div>
                <h2 id="customerName"></h2>
                <p id="customerPhone"></p>
            </div>

        </section>


        <section class="customer-balance">

            <span>الرصيد الحالي</span>

            <strong id="customerBalance">
                0
            </strong>

        </section>


        <div class="actions">

            <button
                class="danger"
                onclick="showTransaction('debt')">
                + عليه
            </button>

            <button
                class="success"
                onclick="showTransaction('payment')">
                − دفعة
            </button>

        </div>


        <section>

            <h3>كشف الحساب</h3>

            <div id="transactionsList"></div>

        </section>

    </main>


    <!-- إضافة عميل -->

    <div
        id="customerModal"
        class="modal hidden">

        <div class="modal-box">

            <h2>إضافة عميل</h2>

            <input
                id="newName"
                placeholder="اسم العميل">

            <input
                id="newPhone"
                type="tel"
                placeholder="رقم الهاتف">

            <input
                id="newAddress"
                placeholder="العنوان">

            <textarea
                id="newNotes"
                placeholder="ملاحظات"></textarea>

            <div class="modal-buttons">

                <button
                    onclick="closeModal()">
                    إلغاء
                </button>

                <button
                    class="primary"
                    onclick="addCustomer()">
                    حفظ
                </button>

            </div>

        </div>

    </div>


    <!-- إضافة حركة -->

    <div
        id="transactionModal"
        class="modal hidden">

        <div class="modal-box">

            <h2 id="transactionTitle">
                إضافة حركة
            </h2>

            <input
                id="transactionAmount"
                type="number"
                inputmode="decimal"
                placeholder="المبلغ">

            <input
                id="transactionNote"
                placeholder="البيان">

            <div class="modal-buttons">

                <button
                    onclick="closeTransaction()">
                    إلغاء
                </button>

                <button
                    class="primary"
                    onclick="saveTransaction()">
                    حفظ
                </button>

            </div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>

    </html>
